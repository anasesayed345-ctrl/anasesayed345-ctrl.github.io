<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>جروبات السكاشن</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f3f6f4; --ink:#12302b; --muted:#5d7772; --card:#ffffff; --line:#d5e0dc;
    --accent:#0f6b5c; --accent-ink:#ffffff; --off:#e6ecea; --off-ink:#8ea39e;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0e1917; --ink:#e4f0ed; --muted:#8fa9a3; --card:#15251f; --line:#25403a;
      --accent:#2fb59b; --accent-ink:#06211c; --off:#1a2b27; --off-ink:#587069;
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:'Cairo','Segoe UI',Tahoma,Arial,sans-serif;
    padding:env(safe-area-inset-top,0) 16px calc(env(safe-area-inset-bottom,0px) + 24px);
    min-height:100vh;
  }
  main{max-width:640px;margin:0 auto;padding-top:32px}
  h1{font-size:2rem;font-weight:800;margin:0 0 6px}
  .sub{color:var(--muted);margin:0 0 28px;line-height:1.7}
  .group{margin-bottom:26px}
  .group h2{
    font-size:1.05rem;font-weight:800;margin:0 0 10px;
    padding-inline-start:12px;border-inline-start:4px solid var(--accent);
  }
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .sec{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    min-height:76px;border-radius:14px;text-decoration:none;
    font-weight:800;font-size:1.35rem;letter-spacing:.5px;
    border:1.5px solid var(--line);
  }
  a.sec{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  a.sec small{font-weight:600;font-size:.72rem;opacity:.85;margin-top:2px}
  a.sec:active{transform:scale(.97)}
  a.sec:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
  .sec.off{background:var(--off);color:var(--off-ink);border-style:dashed;cursor:not-allowed}
  .sec.off small{font-weight:600;font-size:.72rem;margin-top:2px}
  .lectures-grid{grid-template-columns:1fr}
  .lectures-grid .sec{font-size:1.1rem;padding:10px 16px}
</style>
</head>
<body>
<main>
  <h1>روابط المحاضرات</h1>
  <p class="sub">اضغط على اسم الجروب وهيفتحلك جروب الواتساب مباشرة.</p>
  <div id="lectures"></div>

  <h1>جروبات السكاشن</h1>
  <p class="sub">اضغط على اسم السكشن بتاعك وهيفتحلك جروب الواتساب مباشرة.</p>
  <div id="app"></div>
</main>

    A5: 'https://chat.whatsapp.com/DvZrBYnxR9G2PdCx4hlvd8',

  }
};

const lecturesEl = document.getElementById('lectures');
{
  const grid = document.createElement('div');
  grid.className = 'grid lectures-grid';
  for (const [name, url] of Object.entries(LECTURES)) {
    let el;
    if (url) {
      el = document.createElement('a');

      el.setAttribute('aria-disabled', 'true');

    }
    el.className = 'sec' + (url ? '' : ' off');
    grid.appendChild(el);
  }
  lecturesEl.appendChild(grid);
}

const app = document.getElementById('app');
for (const [group, items] of Object.entries(SECTIONS)) {
  const wrap = document.createElement('section');
  wrap.className = 'group';
  wrap.innerHTML = '<h2>مجموعة ' + group + '</h2><div class="grid"></div>';
  const grid = wrap.querySelector('.grid');
  for (const [name, url] of Object.entries(items)) {
    let el;
    if (url) {
      el = document.createElement('a');
      el.href = url;
      el.target = '_blank';

      el.innerHTML = name + '<small>انضم للجروب</small>';
    } else {
      el = document.createElement('div');
      el.setAttribute('aria-disabled', 'true');
      el.innerHTML = name + '<small>قريبًا</small>';
    }
    el.className = 'sec' + (url ? '' : ' off');
    grid.appendChild(el);
  }
  app.appendChild(wrap);
}
</script>
</body>
</html>
